name: Update LiveSports playlist

on:
  schedule:
    - cron: '0 */4 * * *'   # every 4 hours
  workflow_dispatch:        # allows manual run

permissions:
  contents: write           # needed so the action can push changes

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install playwright
          playwright install chromium --with-deps

      - name: Run the updater
        run: python main.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add LiveSports.m3u
          git diff --staged --quiet || git commit -m "Auto update LiveSports.m3u $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
